<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 140" width="420" height="140">
  <defs>
    <linearGradient id="starGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEFA"/>
      <stop offset="100%" style="stop-color:#1A6EA8"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="420" height="140" fill="#0A2240" rx="4"/>

  <!-- Compass star icon -->
  <g transform="translate(70, 70)">
    <polygon points="0,-52 14,-14 0,-22 -14,-14" fill="url(#starGradD)"/>
    <polygon points="52,0 14,14 22,0 14,-14" fill="url(#starGradD)"/>
    <polygon points="0,52 -14,14 0,22 14,14" fill="url(#starGradD)"/>
    <polygon points="-52,0 -14,-14 -22,0 -14,14" fill="url(#starGradD)"/>
    <polygon points="0,-22 22,0 0,22 -22,0" fill="url(#starGradD)"/>
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#0A2240"/>
    <circle cx="0" cy="0" r="3.5" fill="#C9A84C"/>
  </g>

  <!-- BNIG wordmark -->
  <text x="140" y="86"
        font-family="'Arial', 'Helvetica Neue', sans-serif"
        font-size="52"
        font-weight="800"
        letter-spacing="6"
        fill="white">BNIG</text>

  <!-- Gold rule -->
  <rect x="140" y="98" width="262" height="2" fill="#C9A84C"/>

  <!-- Subtitle -->
  <text x="141" y="118"
        font-family="Arial, sans-serif"
        font-size="10"
        font-weight="400"
        letter-spacing="4"
        fill="#87CEFA">BLUE NILE INNOVATION GROUP</text>
</svg>
